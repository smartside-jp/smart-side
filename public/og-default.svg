      <stop offset="0%" stop-color="#fafaf9"/>
      <stop offset="100%" stop-color="#e7e5e4"/>
    </linearGradient>
  </defs>

  <!-- 背景：stone gradient（Lv2 標準色） -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 上部メタライン -->
  <line x1="80" y1="100" x2="1120" y2="100" stroke="#0a0a0a" stroke-width="1" stroke-opacity="0.25"/>
  <text x="80" y="80" font-family="'Courier New', monospace" font-size="13" letter-spacing="3" fill="#0a0a0a" fill-opacity="0.55">— SMART-SIDE.DEV</text>
  <text x="1120" y="80" font-family="'Courier New', monospace" font-size="13" letter-spacing="3" fill="#0a0a0a" fill-opacity="0.55" text-anchor="end">EST. 2026</text>

  <!-- メインタイトル -->
  <text x="80" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="140" font-weight="400" fill="#0a0a0a" letter-spacing="-2">smart-side</text>

  <!-- サブタイトル（日本語） -->
  <text x="80" y="395" font-family="'Yu Gothic', 'Hiragino Sans', 'Meiryo', sans-serif" font-size="32" fill="#0a0a0a" fill-opacity="0.75" font-weight="500">非エンジニアの最低限スターターキット</text>

